name = "lebesgue_star"
version = "0.1.0"
defaultTargets = ["Lebesgue", "LebesgueChallenge", "LebesgueSolution"]
requiresModuleSystem = true

[leanOptions]
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

[[require]]
name = "borodin_triangle"
git = "https://github.com/jtraverso/borodin-light-triangles"
rev = "c85ca2ea4051646c0a4eaa1e03943a44cce11f35"

[[lean_lib]]
name = "Lebesgue"
globs = ["Lebesgue.+"]

[[lean_lib]]
name = "LebesgueChallenge"

[[lean_lib]]
name = "LebesgueSolution"
